<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft – Reseptit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>CodeCraft</h1>
        <p>Löydä seuraava suosikkireseptisi</p>
    </header>

    <main>
        <form id="haku-lomake">
            <input type="text" id="haku" placeholder="Hae reseptiä..." required>
            <button type="submit">Hae</button>
        </form>

        <p id="viesti"></p>
        <section id="tulokset"></section>
        <section id="reseptin-tiedot"></section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
